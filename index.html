<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061a2b">
  <meta name="description" content="Mobile UH field inspections that supplement eMH.">
  <link rel="stylesheet" href="styles.css?v=1.0.2">
  <title>UH Field NEXT · MCAS Futenma</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body><div id="launchSplash" aria-hidden="true"><div class="splash-card"><div class="splash-mark" aria-hidden="true"></div><h1>UH FIELD NEXT</h1><div class="splash-sub">MCAS FUTENMA · v1.0.2</div><p class="splash-quote">“Excellence is built in the details.”</p><div class="splash-ready">Ready to support the mission</div><div class="splash-skip">Tap to skip</div></div></div><div id="processingOverlay" aria-live="polite" aria-busy="true"><div class="processing-card"><div class="spinner" aria-hidden="true"></div><span id="processingText">Working…</span></div></div>
  <header class="app-header">
    <div class="header-brand"><p class="eyebrow">MCAS FUTENMA · UH FIELD OPERATIONS</p><h1>UH Field <span class="next-word">NEXT</span> <span class="header-version">v1.0.2</span></h1></div>
    <button id="installBtn" class="button secondary compact" hidden>Install</button>
  </header>
  <main id="app" aria-live="polite"></main>
  <nav class="bottom-nav" aria-label="Primary navigation">
    <button data-route="daily"><span>⌁</span>Daily</button>
    <button data-route="modules"><span>⌂</span>Home</button>
    <button data-route="inspection"><span>✓</span>Inspect</button>
    <button data-route="records"><span>▤</span>Records</button>
    <button data-route="settings"><span>⚙</span>Settings</button>
  </nav>
  <dialog id="dialog"><div id="dialogBody"></div></dialog>
  <script src="app.js?v=1.0.2" defer></script>
</body>
</html>
